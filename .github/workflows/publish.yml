name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Authenticates through the trusted publisher configured on npmjs.com
      # (gcol33/docrev, publish.yml); provenance is attached automatically.
      # Idempotent: a re-run or a manual workflow_dispatch on an already-published
      # version skips instead of failing with EPUBLISHCONFLICT.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "docrev@$VERSION" version >/dev/null 2>&1; then
            echo "docrev@$VERSION is already published — skipping."
          else
            npm publish --access public
          fi
